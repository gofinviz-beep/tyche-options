# Evening ingest — parallel Cloud Run Jobs (GCP-G).
# Tue–Sat 6:00 PM PT: OHLCV, demand, news, EDGAR (post–market-close sources).

main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: "us-central1"

    - parallel_evening:
        parallel:
          shared: []
          branches:
            - ingest_data:
                steps:
                  - run_ingest_data:
                      call: run_cloud_run_job
                      args:
                        project_id: ${project_id}
                        region: ${region}
                        job_id: "tyche-ingest-data"
                        optional: false
            - ingest_demand:
                steps:
                  - run_ingest_demand:
                      call: run_cloud_run_job
                      args:
                        project_id: ${project_id}
                        region: ${region}
                        job_id: "tyche-ingest-demand-data"
                        optional: false
            - ingest_news:
                steps:
                  - run_ingest_news:
                      call: run_cloud_run_job
                      args:
                        project_id: ${project_id}
                        region: ${region}
                        job_id: "tyche-ingest-news"
                        optional: false
            - ingest_edgar:
                steps:
                  - run_ingest_edgar:
                      call: run_cloud_run_job
                      args:
                        project_id: ${project_id}
                        region: ${region}
                        job_id: "tyche-ingest-edgar"
                        optional: false

    - done:
        return:
          status: "success"
          window: "evening"


run_cloud_run_job:
  params: [project_id, region, job_id, optional]
  steps:
    # jobs.run connector blocks with a 30-minute default LRO timeout — too short
    # for GCS ingest (hours). POST :run returns immediately; we poll execution status.
    - start:
        call: http.post
        args:
          url: ${"https://run.googleapis.com/v2/projects/" + project_id + "/locations/" + region + "/jobs/" + job_id + ":run"}
          auth:
            type: OAuth2
          body: {}
        result: op
    - assign_execution:
        assign:
          - execution_name: ${op.body.metadata.name}
    - poll:
        call: googleapis.run.v2.projects.locations.jobs.executions.get
        args:
          name: ${execution_name}
        result: execution
    - check:
        switch:
          - condition: ${map.get(execution, "completionTime") == null}
            next: wait
          - condition: ${default(map.get(execution, "failedCount"), 0) > 0 or default(map.get(execution, "cancelledCount"), 0) > 0}
            next: fail
        next: succeed
    - wait:
        call: sys.sleep
        args:
          seconds: 45
        next: poll
    - fail:
        switch:
          - condition: ${optional}
            next: succeed_with_warning
          - condition: true
            next: raise_fail
    - raise_fail:
        raise:
          message: '${job_id + " failed"}'
          data: ${execution}
    - succeed_with_warning:
        call: sys.log
        args:
          text: '${"Optional job " + job_id + " did not succeed - continuing pipeline"}'
          severity: "WARNING"
        next: succeed
    - succeed:
        return:
          job_id: ${job_id}
          execution: ${map.get(execution, "name")}
          succeeded: ${default(map.get(execution, "succeededCount"), 0)}
