# Morning ingest — parallel compute then publish (GCP-G).
# Tue–Sat 2:30 AM PT: prior-day options flatfiles + alpha batch in parallel, then publish.
# The demand gate is not part of this pipeline (weekly Saturday schedule instead).

main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: "us-central1"

    # Fire-and-forget: stocks-deep-dive-batch only depends on OHLCV + demand
    # stores (not flatfiles/alpha/gate), so it is kicked off immediately and
    # never polled — it runs in the background for its own duration and must
    # NOT block run_publish. The route reads DeepDiveStore directly (no
    # publish step), so there is nothing downstream waiting on it either.
    - start_deep_dive_batch:
        try:
          call: http.post
          args:
            url: ${"https://run.googleapis.com/v2/projects/" + project_id + "/locations/" + region + "/jobs/tyche-stocks-deep-dive-batch:run"}
            auth:
              type: OAuth2
            body: {}
        except:
          as: e
          steps:
            - log_deep_dive_start_failure:
                call: sys.log
                args:
                  text: '${"Failed to start stocks-deep-dive-batch - " + string(e)}'
                  severity: "WARNING"

    # Fire-and-forget: stocks-screener-index-batch prefers the just-started
    # deep-dive batch's DeepDiveStore payloads but falls back to inline
    # TickerDeepDiveEngine per-ticker when absent, so it is safe to kick off
    # immediately without waiting on deep-dive-batch to finish. Standalone
    # from conviction/publish — must NOT block run_publish.
    - start_screener_index_batch:
        try:
          call: http.post
          args:
            url: ${"https://run.googleapis.com/v2/projects/" + project_id + "/locations/" + region + "/jobs/tyche-stocks-screener-index-batch:run"}
            auth:
              type: OAuth2
            body: {}
        except:
          as: e
          steps:
            - log_screener_index_start_failure:
                call: sys.log
                args:
                  text: '${"Failed to start stocks-screener-index-batch - " + string(e)}'
                  severity: "WARNING"

    - parallel_morning:
        parallel:
          shared: []
          branches:
            - options_flatfiles:
                steps:
                  - run_options_flatfiles:
                      call: run_cloud_run_job
                      args:
                        project_id: ${project_id}
                        region: ${region}
                        job_id: "tyche-ingest-options-flatfiles"
                        optional: false
            - alpha_batch:
                steps:
                  - run_alpha_batch:
                      call: run_cloud_run_job
                      args:
                        project_id: ${project_id}
                        region: ${region}
                        job_id: "tyche-alpha-batch"
                        optional: false

    # NOTE: tyche-run-demand-gate is deliberately NOT in this pipeline. It runs
    # 4-8h and only produces ML model promotions (big_move_sustained_*) that no
    # published route reads, so blocking here pushed publish from ~7 AM to
    # ~12:30 PM PT. It now runs on its own weekly Saturday schedule
    # (tyche-sched-demand-gate) — see infra/gcp/deploy_scheduler.sh.
    - run_stocks_conviction:
        call: run_cloud_run_job
        args:
          project_id: ${project_id}
          region: ${region}
          job_id: "tyche-stocks-conviction-batch"
          optional: false

    - run_stocks_derived:
        call: run_cloud_run_job
        args:
          project_id: ${project_id}
          region: ${region}
          job_id: "tyche-stocks-derived-batch"
          optional: false

    - run_candidate_universe:
        call: run_cloud_run_job
        args:
          project_id: ${project_id}
          region: ${region}
          job_id: "tyche-candidate-universe-batch"
          optional: false

    - run_options_chain_prep:
        call: run_cloud_run_job
        args:
          project_id: ${project_id}
          region: ${region}
          job_id: "tyche-options-chain-prep-batch"
          optional: false

    - run_options_scanner:
        call: run_cloud_run_job
        args:
          project_id: ${project_id}
          region: ${region}
          job_id: "tyche-options-scanner-batch"
          optional: false

    - run_publish:
        call: run_cloud_run_job
        args:
          project_id: ${project_id}
          region: ${region}
          job_id: "tyche-publish-signals"
          optional: false

    - run_audit:
        call: run_cloud_run_job
        args:
          project_id: ${project_id}
          region: ${region}
          job_id: "tyche-audit-snapshots"
          optional: false

    - done:
        return:
          status: "success"
          window: "morning"


run_cloud_run_job:
  params: [project_id, region, job_id, optional]
  steps:
    # jobs.run connector blocks with a 30-minute default LRO timeout — too short
    # for GCS ingest (hours). POST :run returns immediately; we poll execution status.
    - start:
        call: http.post
        args:
          url: ${"https://run.googleapis.com/v2/projects/" + project_id + "/locations/" + region + "/jobs/" + job_id + ":run"}
          auth:
            type: OAuth2
          body: {}
        result: op
    - assign_execution:
        assign:
          - execution_name: ${op.body.metadata.name}
    - poll:
        call: googleapis.run.v2.projects.locations.jobs.executions.get
        args:
          name: ${execution_name}
        result: execution
    - check:
        switch:
          - condition: ${map.get(execution, "completionTime") == null}
            next: wait
          - condition: ${default(map.get(execution, "failedCount"), 0) > 0 or default(map.get(execution, "cancelledCount"), 0) > 0}
            next: fail
        next: succeed
    - wait:
        call: sys.sleep
        args:
          seconds: 45
        next: poll
    - fail:
        switch:
          - condition: ${optional}
            next: succeed_with_warning
          - condition: true
            next: raise_fail
    - raise_fail:
        raise:
          message: '${job_id + " failed"}'
          data: ${execution}
    - succeed_with_warning:
        call: sys.log
        args:
          text: '${"Optional job " + job_id + " did not succeed - continuing pipeline"}'
          severity: "WARNING"
        next: succeed
    - succeed:
        return:
          job_id: ${job_id}
          execution: ${map.get(execution, "name")}
          succeeded: ${default(map.get(execution, "succeededCount"), 0)}
